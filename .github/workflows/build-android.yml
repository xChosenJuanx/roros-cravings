name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "manifest.json"
      - "sw.js"
      - "assets/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Android wrapper
        run: npm install

      - name: Prepare web app
        shell: bash
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.json sw.js www/
          cp -R assets www/assets

      - name: Create Android project
        run: npx cap add android

      - name: Generate Roro's launcher icon
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          while IFS=: read -r folder size; do
            mkdir -p "android/app/src/main/res/mipmap-$folder"
            convert assets/logo.png -resize "${size}x${size}" -background transparent -gravity center -extent "${size}x${size}" "android/app/src/main/res/mipmap-$folder/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$folder/ic_launcher.png" "android/app/src/main/res/mipmap-$folder/ic_launcher_round.png"
          done <<'SIZES'
          mdpi:48
          hdpi:72
          xhdpi:96
          xxhdpi:144
          xxxhdpi:192
          SIZES

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Roros-Cravings-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
