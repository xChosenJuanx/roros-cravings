name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "manifest.json"
      - "sw.js"
      - "assets/**"
      - "package.json"
      - "capacitor.config.json"
      - "google-services.json"
      - "firestore.rules"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        shell: bash
        run: |
          mkdir -p www
          cp index.html app.js style.css manifest.json sw.js www/
          cp -R assets www/assets

      - name: Create Android project
        run: npx cap add android

      - name: Add Firebase Android configuration
        run: cp google-services.json android/app/google-services.json

      - name: Enable delivery location permission
        shell: bash
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Configure permanent release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/roros-cravings-release.jks
          cat > android/app/signing.gradle <<'GRADLE'
          android {
            signingConfigs {
              rorosRelease {
                storeFile file("roros-cravings-release.jks")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias "roroscravings"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.rorosRelease
                minifyEnabled false
              }
            }
          }
          GRADLE
          printf "\napply from: 'signing.gradle'\n" >> android/app/build.gradle

      - name: Generate Roro's launcher icon
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          while IFS=: read -r folder size; do
            mkdir -p "android/app/src/main/res/mipmap-$folder"
            convert assets/logo.png -resize "${size}x${size}" -background transparent -gravity center -extent "${size}x${size}" "android/app/src/main/res/mipmap-$folder/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$folder/ic_launcher.png" "android/app/src/main/res/mipmap-$folder/ic_launcher_round.png"
          done <<'SIZES'
          mdpi:48
          hdpi:72
          xhdpi:96
          xxhdpi:144
          xxxhdpi:192
          SIZES

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Roros-Cravings-v3-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Roros-Cravings-v3-Signed-APK
          path: Roros-Cravings-v3-signed.apk
          if-no-files-found: error
          retention-days: 30
